spring:
  application:
    name: tax-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taxdb}
    username: ${DB_USER:tax}
    password: ${DB_PASSWORD:tax}
    hikari:
      pool-name: tax-pool
      # FIX (Problem 5): right-sized pool. A small pool on a few-core DB beats a
      # bloated one (fewer context switches, lower DB CPU, higher throughput).
      maximum-pool-size: ${HIKARI_MAX_POOL:15}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 10000
      # Let the app start even if the DB is momentarily unavailable (e.g. still
      # finishing its first-run seed); connections are acquired lazily.
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    # Set the dialect explicitly so startup does not require a live JDBC
    # connection to introspect metadata.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
        jdbc:
          time_zone: UTC
          batch_size: 20
        format_sql: false
        generate_statistics: ${HIBERNATE_STATS:false}
  cache:
    # FIX (Problem 3): local cache enabled for the static tax-rule lookups.
    type: ${CACHE_TYPE:caffeine}
    cache-names: taxRules
    caffeine:
      spec: maximumSize=50000,expireAfterWrite=10m

server:
  port: 8080
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}

# Simulated external "product classification" dependency called during a
# tax calculation.
app:
  external:
    classify-latency-ms: ${CLASSIFY_LATENCY_MS:8}
  batch:
    default-limit: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: tax-platform

logging:
  level:
    root: INFO
    # Set to DEBUG (or SHOW_SQL=true) to log every SQL statement Hibernate emits.
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
    org.hibernate.orm.jdbc.bind: INFO
