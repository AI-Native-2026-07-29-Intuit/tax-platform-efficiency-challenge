worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    # Docker's embedded DNS. Re-resolving 'app' on each request spreads load
    # across all running replicas (round-robin), so `docker compose up
    # --scale app=N` and the APP_REPLICAS setting actually load-balance.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        location / {
            set $app_backend "app:8080";
            proxy_pass http://$app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
    }
}
